name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -W error -m compileall -q verify_bridge tests
      - name: Rodar testes
        run: python -m unittest discover -s tests -t . -v
      - name: Filtro cego no exemplo
        run: python -m verify_bridge compile examples/pedido_exemplo.md --audit
      - name: Pacote deste sistema (extraido e testado)
        run: python scripts/empacotar.py --testar ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
